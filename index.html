<body>
    <div class="container">
        <div class="glass-panel">
            <h1 class="neon-text">Pomodoro Timer</h1>
            <div id="timer" class="timer-display">25:00</div>
            <div class="controls">
                <button id="start" class="cyber-button">Start</button>
                <button id="reset" class="cyber-button">Reset</button>
                <button id="break" class="cyber-button">5-Min Break</button>
            </div>
            <div class="custom-time">
                <input type="number" id="customMinutes" class="cyber-input" min="1" max="60" placeholder="Minutes">
                <button id="setCustomTime" class="cyber-button">Set Time</button>
            </div>
            <div class="theme-selector">
                <label for="themeSelect" class="neon-text">Theme:</label>
                <select id="themeSelect" class="cyber-input">
                    <option value="cyberpunk">Cyberpunk</option>
                    <option value="minimal">Minimal</option>
                    <option value="retro">Retro</option>
                    <option value="nature">Nature</option>
                    <option value="space">Space</option>
                    <option value="synthwave">Synthwave</option>
                    <option value="matrix">Matrix</option>
                    <option value="sunset">Sunset</option>
                    <option value="ocean">Ocean</option>
                    <option value="neon">Neon</option>
                </select>
            </div>
            <div class="sound-option">
                <label for="soundToggle" class="neon-text">Sound Off/On:</label>
                <input type="checkbox" id="soundToggle" checked>
            </div>
        </div>
    </div>
